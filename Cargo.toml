
# Rust workspace for the project (Phase 6).
#
# Until now there was a single crate: the Tauri app. The sync server (Phase 6.2)
# runs headless on an Ubuntu with no desktop, so it can't drag in
# `tauri` — which pulls in wry/tao and, on Linux, webkit2gtk. The only way to
# share the sync engine between the app and the server is for the engine to live in
# its own crate that doesn't know Tauri exists.
#
# `crates/core` is that crate. The app and the server are two different fronts
# over the same engine.
[workspace]
resolver = "2"
members = ["app/src-tauri", "crates/core", "crates/native-audio", "crates/server"]

# `crates/native-audio` is a vendored fork of the crates.io plugin
# `tauri-plugin-native-audio` (see its FORK.md). It is a member so `cargo check`
# at the root covers it; it only ships real code for Android/iOS, and the app
# depends on it under the same target gate.

# Dependencies are also optimized in debug. Without this, the sync
# encrypted channel runs unoptimized and gives 3.5 MB/s: sending a 40 MB
# track took 12 s in `tauri dev`. You can lose days chasing that on the network
# — Nagle, wifi, the phone — when the bottleneck is ChaCha20-Poly1305 compiled
# with opt-level 0. In release the same channel gives 476 MB/s: 136x.
#
# To measure it again:
#   cargo test --release -p sway-core -- --ignored --nocapture channel_throughput
#
# Only dependencies, not our own crates: those stay unoptimized, which
# is what keeps the debugger useful and cuts recompilation time. blake3 and
# rusqlite get the same improvement as above.
[profile.dev.package."*"]
opt-level = 3
