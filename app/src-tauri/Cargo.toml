[package]
name = "sway"
version = "0.1.0"
description = "Sway — DJ player/organizer"
edition = "2021"

[lib]
name = "sway_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# The build profile lives in the root Cargo.toml since Phase 6.0
# (cargo ignores `[profile]` in a workspace member).

[dependencies]
# The engine: library, file identity, and sync. Without Tauri inside, so
# the headless server (Phase 6.2) can use exactly the same code.
sway-core = { path = "../../crates/core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
# Only for cover art (cover.rs); import tags are read by sway-core.
lofty = "0.24"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp"] }
base64 = "0.22"
notify-debouncer-mini = "0.7.0"
log = "0.4"

# Device discovery on the LAN (Phase 5.1). Pure Rust, same code on desktop
# and Android. NOTE Android: without MulticastLock it receives NOTHING and
# with no visible error (see MainActivity.kt).
#
# blake3, uuid, snow, and walkdir moved out of here in Phase 6.0: they now
# live in sway-core, which is what uses them.
mdns-sd = "0.20.3"

# On Android eprintln! doesn't reach logcat; without this there's no way to
# see runtime errors (we got burned by this: lofty was failing silently in
# import_bytes/thumb_data_url and there was no way to see it).
[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"

# Whether the network is metered (Phase 6.7). Windows flags this only for a
# cellular modem; for a phone's wifi hotspot it does NOT — the user marks
# that once and it stays pinned to that network. Only the flag is read here.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Networking_Connectivity"] }

# Desktop-only: symphonia/rodio decode audio.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# On Android log::* goes to logcat via android_logger; on desktop, without a
# logger installed, NOTHING PRINTS. The whole sync module uses log::*, so
# without this half of the Phase 5 traces were invisible right where they
# were needed.
env_logger = "0.11.11"
rodio = { version = "0.19", features = ["symphonia-all"] }
# How much battery is left (Phase 6.7). A desktop PC has none, and that's
# not an error: it's the answer, and with it the screen knows it shouldn't
# offer the option.
battery = { package = "starship-battery", version = "0.10" }

# Mobile playback: Media3/ExoPlayer via native plugin, controlled from JS
# (see app/src/nativeAudio.ts). Validated in Phase 0.5, see spike-android-audio/.
#
# Vendored, not from crates.io: upstream 1.0.5 exposes one media item and no
# volume, which leaves gain/ReplayGain, gapless, crossfade and output-device
# selection impossible to reach from outside the plugin. See
# `crates/native-audio/FORK.md`.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-native-audio = { path = "../../crates/native-audio" }
