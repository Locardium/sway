[package]
name = "sway-server"
version = "0.1.0"
description = "Sway's archive and sync server — no interface, meant to be left running"
edition = "2021"

[lib]
name = "sway_server"
path = "src/lib.rs"

[[bin]]
name = "sway-server"
path = "src/main.rs"

[dependencies]
# The same engine that runs inside the app. Being literally the same code is
# the whole point: a server with its own implementation of the protocol
# would be a second thing to keep in sync, and the one that falls behind
# corrupts libraries.
sway-core = { path = "../core" }
anyhow = "1"
log = "0.4"
env_logger = "0.11.11"
serde = { version = "1", features = ["derive"] }
# The config file is edited by a person in a terminal over SSH.
toml = "0.8"
# Pairing token: v4 is random, which is the only thing asked of it.
uuid = { version = "1", features = ["v4"] }

# To tell whether the console was opened by a double click (in which case it
# has to stay open so it can be read) or is a terminal or a service (where
# waiting for a keypress would mean hanging). See `hold_window_open` in main.rs.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }
