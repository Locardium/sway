[package]
name = "sway-core"
version = "0.1.0"
description = "Motor de biblioteca y sync de Sway, sin interfaz"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
lofty = "0.24"
walkdir = "2"
log = "0.4"

# blake3 = identidad de los bytes de cada archivo: elegido sobre sha256 por
# velocidad (importa con bibliotecas de 100+ GB) y porque su arbol interno
# permite verificar por chunk, no solo al final del archivo.
# uuid = identidad logica de tracks/playlists, estable entre dispositivos
# (los `id` INTEGER son locales y no significan nada del otro lado).
blake3 = "1"
uuid = { version = "1", features = ["v4"] }

# Canal cifrado del sync (Fase 5.2): handshake Noise XX. Sin features por
# default a proposito — el set completo arrastra `ring` (C/asm, un problema
# mas en el cross-compile a Android) y AES, que no se usa. Esto deja
# exactamente lo que pide Noise_XX_25519_ChaChaPoly_BLAKE2s, todo Rust puro.
#
# OJO: tampoco va la feature "std". En snow 0.10 esta declarada como
# `std = [..., "ring/std"]` (sin el `?`), asi que prenderla FUERZA la
# dependencia opcional `ring` aunque no se use ningun resolver de ring.
snow = { version = "0.10", default-features = false, features = [
    "default-resolver",
    "use-curve25519",
    "use-chacha20poly1305",
    "use-blake2",
    "use-sha2",
    "use-getrandom",
] }

# La papelera del OS no existe en Android (ver db.rs::delete_tracks, que ahi
# borra directo). El resto de la papelera de Sway es nuestra y es puro
# filesystem (trash.rs), asi que funciona en todos lados.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
trash = "5.2.6"
