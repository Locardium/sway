[package]
name = "sway-core"
version = "0.1.0"
description = "Sway's library and sync engine, no UI"
edition = "2021"

[dependencies]
anyhow = "1"
# Noise keys are stored as plain text in `app_settings`.
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
lofty = "0.24"
walkdir = "2"
log = "0.4"

# blake3 = identity of each file's bytes: chosen over sha256 for speed
# (matters with 100+ GB libraries) and because its internal tree allows
# verifying per chunk, not just at the end of the file.
# uuid = logical identity of tracks/playlists, stable across devices
# (the `id` INTEGERs are local and mean nothing on the other side).
blake3 = "1"
uuid = { version = "1", features = ["v4"] }

# The sync inventory travels as JSON, and it's about as compressible as it
# gets: repeated keys on every row, uuids and hashes in hex. With 5000
# tracks that's 4 MB per comparison, and those comparisons go out over the
# internet from a phone. No default features on purpose: the C backend
# (`zlib`) is one more problem in cross-compiling to Android and musl, and
# `rust_backend` (miniz_oxide) is pure Rust.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# Encrypted sync channel (Phase 5.2): Noise XX handshake. No default
# features on purpose — the full set drags in `ring` (C/asm, one more
# problem in cross-compiling to Android) and AES, which isn't used. This
# leaves exactly what Noise_XX_25519_ChaChaPoly_BLAKE2s needs, all pure
# Rust.
#
# NOTE: the "std" feature isn't enabled either. In snow 0.10 it's declared
# as `std = [..., "ring/std"]` (without the `?`), so turning it on FORCES
# the optional `ring` dependency even though no ring resolver is used.
snow = { version = "0.10", default-features = false, features = [
    "default-resolver",
    "use-curve25519",
    "use-chacha20poly1305",
    "use-blake2",
    "use-sha2",
    "use-getrandom",
] }

# The OS trash doesn't exist on Android (see db.rs::delete_tracks, which
# deletes directly there). The rest of Sway's trash is our own and pure
# filesystem (trash.rs), so it works everywhere.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
trash = "5.2.6"
